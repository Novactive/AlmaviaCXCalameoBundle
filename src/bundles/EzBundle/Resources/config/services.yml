parameters:

services:
  # default configuration for services in *this* file
  _defaults:
    # automatically injects dependencies in your services
    autowire: true
    # automatically registers your services as commands, event subscribers, etc.
    autoconfigure: true
    # this means you cannot fetch services directly from the container via $container->get()
    # if you need to do this, you can override this setting on individual services
    public: false

  AlmaviaCX\Calameo\:
    # * AlmaviaCXCalameoBundle/src/
    #  ** bundles/EzBundle/Resources/config/services.yml
    #  ** lib
    #
    # namespace AlmaviaCX\Calameo\Ez\Form\Type\FieldType;
    resource: '../../../../lib/*'
#    exclude:
#      - '../../../../lib/**/Value/'
#      - '../../../../lib/**/Exception/'

  AlmaviaCX\Calameo\Ez\FieldType\CalameoPublication\FormMapper:
    tags:
      - { name: ez.fieldFormMapper.definition, fieldType: calameo_publication }
      - { name: ez.fieldFormMapper.value, fieldType: calameo_publication }
      - { name: ibexa.admin_ui.field_type.form.mapper.definition, fieldType: calameo_publication }
      - { name: ibexa.admin_ui.field_type.form.mapper.value, fieldType: calameo_publication }

  AlmaviaCX\Calameo\Ez\Form\Type\FieldType\CalameoPublicationFieldType:

  AlmaviaCX\Calameo\Ez\FieldType\CalameoPublication\Gateway\DoctrineStorage:

  AlmaviaCX\Calameo\API\HttpClientFactory: ~

  AlmaviaCX\Calameo\API\HttpClient:
    lazy: true
    factory: ['@AlmaviaCX\Calameo\API\HttpClientFactory', 'create']

  AlmaviaCX\Calameo\Ez\Twig\CalameoTwigExtension:

  AlmaviaCX\Bundle\Calameo\EzBundle\Controller\:
    resource: '../../Controller/'
    arguments:
      $APIKey: "%almaviacx.calameo.api.key%"
      $APISecret: "%almaviacx.calameo.api.secret%"
      $config: "%almaviacx.calameo.http_client.config%"
      $deleteBookEnable: "%almaviacx.calameo.delete_book_enable%"
    tags: ['controller.service_arguments']
